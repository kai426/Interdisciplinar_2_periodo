<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Sistema de Agendamento de Salas</title>
    <link rel="stylesheet" href="style.css">
    <script src="admin.js" defer></script>
</head>
<body>
    <div class="navbar">
        <h1>Painel do Administrador</h1>
        <div class="user-info">
            <span id="nomeUsuario"></span>
            <button id="btnLogout" class="btn-logout">Sair</button>
        </div>
    </div>

    <div class="container">
        <!-- Seção 1: Gerenciar Salas -->
        <section class="section-admin">
            <h2>Gerenciar Salas</h2>
            <form id="formSala">
                <div class="form-group">
                    <label for="nomeSala">Nome da Sala:</label>
                    <input type="text" id="nomeSala" name="nomeSala" required>
                </div>

                <div class="form-group">
                    <label for="capacidadeSala">Capacidade:</label>
                    <input type="number" id="capacidadeSala" name="capacidadeSala" required>
                </div>

                <div class="form-group">
                    <label for="descricaoSala">Descrição:</label>
                    <textarea id="descricaoSala" name="descricaoSala"></textarea>
                </div>

                <button type="submit" class="btn-admin">Adicionar Sala</button>
            </form>
            <p id="mensagemSala" class="mensagem" style="display: none;"></p>

            <h3>Salas Cadastradas</h3>
            <table class="tabela-admin">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Capacidade</th>
                        <th>Descrição</th>
                        <th>Ação</th>
                    </tr>
                </thead>
                <tbody id="corpoSalas"></tbody>
            </table>
        </section>

        <!-- Seção 2: Visualizar Todos os Agendamentos -->
        <section class="section-admin">
            <h2>Todos os Agendamentos</h2>
            <table class="tabela-admin">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Usuário</th>
                        <th>Sala</th>
                        <th>Data/Hora Início</th>
                        <th>Data/Hora Fim</th>
                        <th>Status</th>
                        <th>Ação</th>
                    </tr>
                </thead>
                <tbody id="corpoAgendamentosAdmin"></tbody>
            </table>
        </section>
    </div>
</body>
</html>
