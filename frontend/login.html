<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Agendamento de Salas - Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="app.js" defer></script>
</head>
<body>
    <div class="container-login">
        <div class="login-box">
            <h1>Fazer Login</h1>
            
            <form id="loginForm">
                <div class="input-box">
                    <label for="email" class="form-label">Email:</label>
                    <div class="input-field">
                        <input type="email" id="email" name="email" class="form-control" placeholder="exemplo@gmail.com" required>
                        <i class="fa-regular fa-envelope"></i>
                    </div>
                </div>

                <div class="input-box">
                    <label for="senha" class="form-label">Senha:</label>
                    <div class="input-field">
                        <input type="password" id="senha" name="senha" class="form-control" placeholder="*******" required>
                        <i class="fa-solid fa-lock"></i>
                    </div>
                </div>

                <button type="submit" class="btn-login">Entrar</button>
            </form>

            <p id="mensagemErro" class="erro" style="display: none;"></p>
            
            <p>
                Não tem uma conta? <a href="index.html">Cadastre-se</a>
            </p>
        </div>
    </div>
</body>
</html>
